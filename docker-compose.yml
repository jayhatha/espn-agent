
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: espn-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-espn_fantasy}
      POSTGRES_USER: ${POSTGRES_USER:-espn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-espn_user} -d ${POSTGRES_DB:-espn_fantasy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - espn-network
    restart: always

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: espn-redis-prod
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - espn-network
    restart: always

  # Backend API
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: espn-backend-prod
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-espn_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-espn_fantasy}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - espn-network
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend Worker
  worker:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: espn-worker-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-espn_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-espn_fantasy}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: ["node", "dist/workers/snapshot-worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - espn-network
    restart: always

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: espn-frontend-prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - espn-network
    restart: always

networks:
  espn-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
