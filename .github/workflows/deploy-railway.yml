name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggers

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Link to backend service and deploy
          railway link ${{ secrets.RAILWAY_PROJECT_ID }}
          railway service backend

          # Use backend config temporarily
          cp railway.backend.json railway.json.bak
          cp railway.backend.json railway.json

          railway up --service backend --detach

          # Restore config
          mv railway.json.bak railway.json

      - name: Deploy Workers
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link ${{ secrets.RAILWAY_PROJECT_ID }}
          railway service workers

          # Use workers config temporarily
          cp railway.workers.json railway.json.bak
          cp railway.workers.json railway.json

          railway up --service workers --detach

          # Restore config
          mv railway.json.bak railway.json

      - name: Deploy Frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link ${{ secrets.RAILWAY_PROJECT_ID }}
          railway service frontend

          # Use frontend config temporarily
          cp railway.frontend.json railway.json.bak
          cp railway.frontend.json railway.json

          railway up --service frontend --detach

          # Restore config
          mv railway.json.bak railway.json

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Backend: https://backend-production-c473.up.railway.app"
          echo "Frontend: https://frontend-production-1e247.up.railway.app"
